<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Sample vintage football illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d1830"/>
      <stop offset="1" stop-color="#3c0711"/>
    </linearGradient>
    <radialGradient id="wash" cx="18%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ff8a96" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8a96" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leather" cx="40%" cy="30%" r="72%">
      <stop offset="0" stop-color="#f0c48a"/>
