      <stop offset="1" stop-color="#6a3c16"/>
    </radialGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.8" fill="#3a2410" opacity="0.4"/>
      <circle cx="6" cy="6" r="0.5" fill="#ffe0b8" opacity="0.4"/>
    </pattern>
    <clipPath id="ball">
      <ellipse cx="320" cy="186" rx="198" ry="112" transform="rotate(16 320 186)"/>
    </clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#wash)"/>
  <rect x="16" y="16" width="608" height="368" fill="none" stroke="#FFB81C" stroke-width="2.5"/>
  <ellipse cx="324" cy="304" rx="180" ry="15" fill="#140208" opacity="0.4"/>
  <g clip-path="url(#ball)">
