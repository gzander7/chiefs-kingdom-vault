<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Sample framed portrait illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d1830"/>
      <stop offset="1" stop-color="#3c0711"/>
    </linearGradient>
    <radialGradient id="wash" cx="18%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ff8a96" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8a96" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a8"/>
      <stop offset="0.35" stop-color="#a87820"/>
      <stop offset="0.7" stop-color="#ffe7b0"/>
      <stop offset="1" stop-color="#8a6418"/>
    </linearGradient>
    <radialGradient id="well" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a32038"/>
      <stop offset="1" stop-color="#3a0a14"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#wash)"/>
  <rect x="16" y="16" width="608" height="368" fill="none" stroke="#FFB81C" stroke-width="2.5"/>
  <ellipse cx="320" cy="348" rx="150" ry="12" fill="#140208" opacity="0.4"/>
  <rect x="168" y="42" width="304" height="286" rx="4" fill="#1a0a0c"/>
  <rect x="176" y="50" width="288" height="270" fill="url(#frame)"/>
  <rect x="196" y="70" width="248" height="230" fill="#f4efe4"/>
  <rect x="214" y="88" width="212" height="194" fill="url(#well)"/>
  <circle cx="320" cy="150" r="36" fill="#1a060c"/>
  <ellipse cx="320" cy="230" rx="58" ry="40" fill="#1a060c"/>
  <ellipse cx="292" cy="128" rx="16" ry="8" fill="#fff" opacity="0.12"/>
  <path d="M214 250c18-12 24 0 32 5 8 5 4-12 16-10 12 2 10 14 22 8" fill="none" stroke="#FFB81C" stroke-width="3.5" stroke-linecap="round"/>
  <text x="36" y="366" fill="#FFB81C" font-family="serif" font-size="22" letter-spacing="4">SAMPLE</text>
