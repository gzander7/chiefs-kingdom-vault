<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Sample trading card illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d1830"/>
      <stop offset="1" stop-color="#3c0711"/>
    </linearGradient>
    <radialGradient id="wash" cx="82%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ff8a96" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a96" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a62"/>
      <stop offset="1" stop-color="#9a1428"/>
    </linearGradient>
    <linearGradient id="foil" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0.2" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#fff8e4" stop-opacity="0.7"/>
      <stop offset="0.54" stop-color="#FFB81C" stop-opacity="0.65"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="well" cx="60%" cy="28%" r="75%">
      <stop offset="0" stop-color="#3a1020"/>
      <stop offset="1" stop-color="#14060c"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="214" y="28" width="212" height="312" rx="14"/>
    </clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#wash)"/>
  <rect x="16" y="16" width="608" height="368" fill="none" stroke="#FFB81C" stroke-width="2.5"/>
  <ellipse cx="320" cy="352" rx="90" ry="10" fill="#140208" opacity="0.45"/>
  <g clip-path="url(#card)">
    <rect x="214" y="28" width="212" height="312" fill="url(#stock)"/>
    <rect x="226" y="40" width="188" height="288" fill="none" stroke="#FFB81C" stroke-width="8"/>
    <rect x="240" y="56" width="160" height="168" rx="6" fill="url(#well)"/>
    <circle cx="338" cy="114" r="28" fill="#f4efe6"/>
    <ellipse cx="300" cy="180" rx="48" ry="28" fill="#f4efe6"/>
    <rect x="240" y="56" width="160" height="168" fill="url(#foil)"/>
    <polygon points="320,236 328,252 346,254 332,266 336,284 320,274 304,284 308,266 294,254 312,252" fill="#FFB81C"/>
    <path d="M250 300c16-12 22 0 30 5 8 5 4-12 16-8 12 4 8 14 20 8" fill="none" stroke="#fff6d0" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <text x="36" y="366" fill="#FFB81C" font-family="serif" font-size="22" letter-spacing="4">SAMPLE</text>
</svg>
