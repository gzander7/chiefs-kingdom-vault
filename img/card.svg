<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <title>Sample trading card illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d1830"/>
      <stop offset="1" stop-color="#3c0711"/>
    </linearGradient>
    <radialGradient id="wash" cx="18%" cy="0%" r="75%">
      <stop offset="0" stop-color="#ff8a96" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a96" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#efe4d4"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.15" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FFB81C" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="well" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#E31837"/>
      <stop offset="1" stop-color="#6e1020"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="214" y="28" width="212" height="312" rx="14"/>
    </clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#wash)"/>
  <rect x="16" y="16" width="608" height="368" fill="none" stroke="#FFB81C" stroke-width="2.5"/>
  <ellipse cx="320" cy="352" rx="90" ry="10" fill="#140208" opacity="0.45"/>
  <g clip-path="url(#card)">
    <rect x="214" y="28" width="212" height="312" fill="url(#stock)"/>
    <rect x="226" y="40" width="188" height="288" fill="none" stroke="#FFB81C" stroke-width="8"/>
    <rect x="240" y="56" width="160" height="168" rx="6" fill="url(#well)"/>
    <circle cx="320" cy="112" r="28" fill="#2a0c12"/>
    <ellipse cx="320" cy="176" rx="46" ry="30" fill="#2a0c12"/>
    <rect x="240" y="56" width="160" height="168" fill="url(#foil)"/>
    <path d="M250 248h140M250 262h100" stroke="#c4b09a" stroke-width="4" stroke-linecap="round"/>
    <path d="M248 286c14-10 20 0 28 4 8 4 4-10 14-8 10 2 8 12 18 8" fill="none" stroke="#E31837" stroke-width="3" stroke-linecap="round"/>
    <path d="M248 286c14-10 20 0 28 4 8 4 4-10 14-8 10 2 8 12 18 8" fill="none" stroke="#FFB81C" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="36" y="366" fill="#FFB81C" font-family="serif" font-size="22" letter-spacing="4">SAMPLE</text>
</svg>
